<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giám Sát Băng Chuyền Nhận - 3D Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .label-3d {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; transition: opacity 0.15s; z-index: 10;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen">

  <!-- THANH ĐIỀU HƯỚNG TRÊN CÙNG -->
  <header class="h-12 bg-slate-900 border-b border-slate-700 px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <h1 class="font-bold text-sm tracking-wider uppercase text-cyan-400">Hệ Thống Băng Chuyền Nhận (Inbound Tele Line)</h1>
      <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-600">GitHub Pages Mode</span>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="px-3 py-1.5 text-xs font-semibold rounded bg-cyan-600 text-white">Màn Hình 3D</a>
      <a href="pic.html" class="px-3 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:bg-slate-700">Trang Nhập Tên (PIC)</a>
    </div>
  </header>

  <!-- MÀN HÌNH 3D + CỘT SỐ LIỆU -->
  <div class="flex flex-1 overflow-hidden relative">
    <div id="canvasContainer" class="flex-1 relative h-full overflow-hidden bg-slate-950">
      <div id="labelsContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
      <div class="absolute bottom-3 left-3 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded text-xs text-slate-400 z-30">
        Chuột trái: Xoay | Con lăn: Thu phóng | Cập nhật lúc: <span id="lastSyncText" class="text-cyan-400 font-mono">--:--:--</span>
      </div>
    </div>

    <!-- CỘT SỐ LIỆU BÊN PHẢI -->
    <aside class="w-96 bg-slate-900/95 border-l border-slate-700 flex flex-col h-full shrink-0 z-20 overflow-y-auto p-3 space-y-4">
      <div>
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400">Số Liệu Từng Tele Line</h2>
          <span id="totalShiftSum" class="text-xs font-bold bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-700">Tổng: 0</span>
        </div>
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400">
              <th class="py-1.5">Line / PIC</th>
              <th class="py-1.5 text-right">Giờ hiện tại</th>
              <th class="py-1.5 text-right">Tổng ca</th>
            </tr>
          </thead>
          <tbody id="lineTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>

      <hr class="border-slate-800">

      <div>
        <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">Số Tổng Mỗi Giờ (Hourly API)</h2>
        <div id="hourlyList" class="space-y-2 text-xs"></div>
      </div>
    </aside>
  </div>

<script>
  let appState = {
    lastSync: '--:--:--',
    lines: [
      { id: 'L1', name: 'TELE LINE 01', operator: 'Nguyễn Văn An', empId: 'NV01', targetPerHour: 450, currentHourCount: 380, totalShiftCount: 1520, status: 'active' },
      { id: 'L2', name: 'TELE LINE 02', operator: 'Trần Minh Tâm', empId: 'NV02', targetPerHour: 450, currentHourCount: 410, totalShiftCount: 1680, status: 'active' },
      { id: 'L3', name: 'TELE LINE 03', operator: 'Lê Hoàng Nam', empId: 'NV03', targetPerHour: 450, currentHourCount: 290, totalShiftCount: 1190, status: 'alert' },
      { id: 'L4', name: 'TELE LINE 04', operator: 'Phạm Thị Hoa', empId: 'NV04', targetPerHour: 450, currentHourCount: 445, totalShiftCount: 1750, status: 'active' },
      { id: 'L5', name: 'TELE LINE 05', operator: 'Võ Quốc Bảo', empId: 'NV05', targetPerHour: 450, currentHourCount: 360, totalShiftCount: 1410, status: 'active' }
    ],
    hourly: [
      { hour: '07:00 - 08:00', total: 1850, target: 2000, active: false },
      { hour: '08:00 - 09:00', total: 2120, target: 2000, active: false },
      { hour: '09:00 - 10:00', total: 1940, target: 2000, active: false },
      { hour: '10:00 - 11:00', total: 1885, target: 2000, active: true }
    ]
  };

  function loadData() {
    try {
      const saved = localStorage.getItem('inbound_system_data');
      if (saved) {
        appState = JSON.parse(saved);
      }
    } catch(e) {}
    appState.lastSync = new Date().toLocaleTimeString('vi-VN');
    renderUI();
  }

  function renderUI() {
    try {
      document.getElementById('lastSyncText').textContent = appState.lastSync;
      let sumShift = 0;
      const tbody = document.getElementById('lineTableBody');
      tbody.innerHTML = '';
      
      appState.lines.forEach(l => {
        sumShift += l.totalShiftCount;
        const color = l.status === 'alert' ? 'text-rose-400' : 'text-emerald-400';
        tbody.innerHTML += `
          <tr>
            <td class="py-2">
              <div class="font-bold text-white">${l.name}</div>
              <div class="text-slate-400">${l.operator} <span class="text-slate-500">(${l.empId})</span></div>
            </td>
            <td class="py-2 text-right font-mono font-bold ${color}">${l.currentHourCount} <span class="text-slate-500 font-normal">/ ${l.targetPerHour}</span></td>
            <td class="py-2 text-right font-mono font-bold text-cyan-300">${l.totalShiftCount.toLocaleString()}</td>
          </tr>`;
      });
      document.getElementById('totalShiftSum').textContent = 'Tổng ca: ' + sumShift.toLocaleString();

      const hList = document.getElementById('hourlyList');
      hList.innerHTML = '';
      appState.hourly.forEach(h => {
        const pct = Math.min(100, Math.round((h.total / (h.target || 1)) * 100));
        hList.innerHTML += `
          <div class="p-2 rounded bg-slate-800/70 border ${h.active ? 'border-amber-500/60' : 'border-slate-700'}">
            <div class="flex justify-between mb-1">
              <span class="font-mono ${h.active ? 'text-amber-300 font-bold' : 'text-slate-300'}">${h.hour}</span>
              <span class="font-mono font-bold text-white">${h.total.toLocaleString()} <span class="text-slate-400 font-normal">(${pct}%)</span></span>
            </div>
            <div class="w-full bg-slate-950 h-1.5 rounded overflow-hidden">
              <div class="bg-amber-400 h-full" style="width:${pct}%"></div>
            </div>
          </div>`;
      });
      update3DLabelsContent();
    } catch(e) {}
  }

  let scene, camera, renderer, controls;
  const stationPositions = [];
  const labelElements = [];
  const boxes = [];
  let is3DInitialized = false;

  function init3D() {
    if (is3DInitialized) return;
    const container = document.getElementById('canvasContainer');
    const width = container.clientWidth;
    const height = container.clientHeight;

    // Nếu trình duyệt chưa kịp đo kích thước container thì chờ thêm chút
    if (width === 0 || height === 0) {
      setTimeout(init3D, 100);
      return;
    }

    try {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1120);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 22, 28);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 30, 20);
      scene.add(dirLight);
      scene.add(new THREE.GridHelper(40, 40, 0x1e293b, 0x1e293b));

      // Băng chuyền chính
      const mainBelt = new THREE.Mesh(
        new THREE.BoxGeometry(30, 0.6, 2.2),
        new THREE.MeshStandardMaterial({ color: 0x334155 })
      );
      mainBelt.position.set(0, 1, -4);
      scene.add(mainBelt);

      const startX = -10, spacing = 5;
      const labelsWrap = document.getElementById('labelsContainer');

      for (let i = 0; i < 5; i++) {
        const x = startX + i * spacing;
        const branch = new THREE.Mesh(
          new THREE.BoxGeometry(1.6, 0.5, 9),
          new THREE.MeshStandardMaterial({ color: 0x475569 })
        );
        branch.position.set(x, 1, 1.5);
        scene.add(branch);

        const operatorMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.45, 0.45, 1.6, 16),
          new THREE.MeshStandardMaterial({ color: 0x06b6d4 })
        );
        operatorMesh.position.set(x, 1.2, 6.8);
        scene.add(operatorMesh);

        stationPositions.push(new THREE.Vector3(x, 3.2, 6.8));

        const el = document.createElement('div');
        el.className = 'label-3d bg-slate-900/95 border border-cyan-500/60 rounded px-2.5 py-1 text-center shadow-lg min-w-[125px]';
        labelsWrap.appendChild(el);
        labelElements.push(el);

        const box = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.6, 0.8),
          new THREE.MeshStandardMaterial({ color: 0xf59e0b })
        );
        box.position.set(x, 1.6, 5 - i * 1.5);
        scene.add(box);
        boxes.push({ mesh: box });
      }

      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (w > 0 && h > 0) {
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }
      });

      is3DInitialized = true;
      animate();
    } catch(e) {
      console.error("Lỗi khởi tạo 3D:", e);
    }
  }

  function update3DLabelsContent() {
    try {
      appState.lines.forEach((line, i) => {
        if (!labelElements[i]) return;
        const borderCol = line.status === 'alert' ? 'border-rose-500' : 'border-cyan-500/70';
        labelElements[i].className = `label-3d bg-slate-900/95 border ${borderCol} rounded px-2.5 py-1 text-center shadow-lg min-w-[130px]`;
        labelElements[i].innerHTML = `
          <div class="text-[10px] font-bold text-cyan-400">${line.name}</div>
          <div class="text-xs font-bold text-white truncate">${line.operator}</div>
          <div class="text-[11px] font-mono text-emerald-400">${line.currentHourCount} pcs/h | Tổng: ${line.totalShiftCount}</div>
        `;
      });
    } catch(e) {}
  }

  function animate() {
    requestAnimationFrame(animate);
    if (!renderer || !scene || !camera) return;
    try {
      if (controls) controls.update();

      boxes.forEach(b => {
        b.mesh.position.z -= 0.05;
        if (b.mesh.position.z < -3.5) b.mesh.position.z = 5.8;
      });

      const container = document.getElementById('canvasContainer');
      stationPositions.forEach((pos, i) => {
        const projected = pos.clone().project(camera);
        const x = (projected.x * 0.5 + 0.5) * container.clientWidth;
        const y = (-(projected.y * 0.5) + 0.5) * container.clientHeight;
        if (labelElements[i]) {
          labelElements[i].style.left = `${x}px`;
          labelElements[i].style.top = `${y}px`;
          labelElements[i].style.opacity = projected.z < 1 ? '1' : '0';
        }
      });

      renderer.render(scene, camera);
    } catch(e) {}
  }

  window.onload = function() {
    loadData();
    // Đợi 100ms để trình duyệt vẽ xong khung giao diện rồi mới khởi tạo 3D
    setTimeout(init3D, 100);
    setInterval(loadData, 3000);
  };
</script>
</body>
</html>
